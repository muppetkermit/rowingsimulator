<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rowing Simulator — Top-down</title>
  <style>
    html,body { height:100%; margin:0; }
    body { display:flex; align-items:center; justify-content:center; background:#0b1220; color:#e6f0ff; font-family:Inter, system-ui, sans-serif; }
    #sim { width:960px; height:720px; position:relative; }
    canvas { display:block; background:#0b2030; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.6); }
    .hud {
      position:absolute; left:12px; top:12px; background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:8px; font-size:13px;
    }
    .instr { position:absolute; left:12px; bottom:12px; background:rgba(0,0,0,0.28); padding:8px 12px; border-radius:8px; font-size:13px; }
  </style>
</head>
<body>
  <div id="sim">
    <canvas id="c" width="960" height="720"></canvas>
    <div class="hud" id="hud">Speed: <span id="hud-speed">0.0</span> • Heading: <span id="hud-heading">0°</span></div>
    <div class="instr">Controls: <strong>W</strong>=forward, <strong>S</strong>=reverse, <strong>A</strong>/<strong>D</strong>=steer — feel floaty on water</div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const hudSpeed = document.getElementById('hud-speed');
    const hudHeading = document.getElementById('hud-heading');

    const keys = {};
    window.addEventListener('keydown', e => { if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault(); keys[e.code]=true; });
    window.addEventListener('keyup', e => { keys[e.code]=false; });

    // Boat state
    const boat = {
      x: W*0.5,
      y: H*0.6,
      vx: 0,
      vy: 0,
      angle: -Math.PI/2, // facing up
      omega: 0,
      length: 48,
      width: 12,
      mass: 1.2,
      inertia: 1.0,
      maxThrust: 0.12,
      maxRudder: 0.9
    };

    // simple river bounds (vertical band)
    const river = { x: W*0.18, w: W*0.64 };

    // helper
    function clamp(a,min,max){ return Math.max(min,Math.min(max,a)); }
    function angDiff(a,b){ let d=a-b; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; }

    let lastT = performance.now();
    function step(now){
      const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;

      // Controls -> forces
      let thrust = 0;
      if (keys.KeyW) thrust += boat.maxThrust;
      if (keys.KeyS) thrust -= boat.maxThrust*0.6;

      // thrust applied in boat forward direction
      const fx = Math.cos(boat.angle) * thrust;
      const fy = Math.sin(boat.angle) * thrust;

      // water drag (linear + quadratic) to feel floaty
      const kv = 0.9; // linear drag coefficient (per second)
      const kq = 0.6; // quadratic
      const axDrag = (-kv*boat.vx - kq*boat.vx*Math.abs(boat.vx));
      const ayDrag = (-kv*boat.vy - kq*boat.vy*Math.abs(boat.vy));

      // acceleration
      const ax = (fx)/boat.mass + axDrag;
      const ay = (fy)/boat.mass + ayDrag;
      boat.vx += ax * dt;
      boat.vy += ay * dt;

      // steering (apply torque)
      let rudder = 0;
      if (keys.KeyA) rudder -= 1;
      if (keys.KeyD) rudder += 1;

      // torque from rudder plus passive alignment to velocity (water guiding the hull)
      const velSpeed = Math.hypot(boat.vx, boat.vy) + 1e-6;
      const velDir = Math.atan2(boat.vy, boat.vx);
      const alignStrength = 0.8; // how strongly hull aligns with movement (higher = more snappy alignment)
      const angError = angDiff(velDir, boat.angle);
      const alignTorque = angError * alignStrength * 0.2 * Math.min(1, velSpeed/2);

      const torque = (rudder * boat.maxRudder * 0.6) + alignTorque;
      const alpha = torque / boat.inertia;
      boat.omega += alpha * dt;
      // angular damping
      boat.omega *= clamp(1 - 1.8*dt, 0.01, 1);
      boat.angle += boat.omega * dt;

      // integrate position
      boat.x += boat.vx * dt * 60; // scale to feel responsive
      boat.y += boat.vy * dt * 60;

      // keep inside canvas and gently bounce off banks
      const leftBank = river.x;
      const rightBank = river.x + river.w;
      if (boat.x < leftBank + 8) { boat.x = leftBank + 8; boat.vx *= -0.2; }
      if (boat.x > rightBank - 8) { boat.x = rightBank - 8; boat.vx *= -0.2; }
      if (boat.y < 20) { boat.y = 20; boat.vy *= -0.2; }
      if (boat.y > H-20) { boat.y = H-20; boat.vy *= -0.2; }

      draw();
      requestAnimationFrame(step);
    }

    function draw(){
      // background
      ctx.clearRect(0,0,W,H);
      // banks
      ctx.fillStyle = '#10202a';
      ctx.fillRect(0,0,W,H);
      // river gradient
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#0f3a5a');
      g.addColorStop(0.5,'#08324c');
      g.addColorStop(1,'#072838');
      ctx.fillStyle = g;
      ctx.fillRect(river.x,0,river.w,H);

      // subtle current lines
      ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 1;
      for(let i=0;i<12;i++){
        const t = (i/12 + (boat.y/2000))%1;
        ctx.beginPath();
        ctx.moveTo(river.x + Math.sin(t*8)*12, i*(H/12));
        ctx.lineTo(river.x + river.w + Math.sin(t*8+1.2)*12, i*(H/12)+10);
        ctx.stroke();
      }

      // draw boat
      ctx.save();
      ctx.translate(boat.x, boat.y);
      ctx.rotate(boat.angle);
      // hull
      ctx.fillStyle = '#ffd86b';
      ctx.beginPath();
      ctx.moveTo(0, -boat.length*0.5);
      ctx.lineTo(-boat.width, boat.length*0.3);
      ctx.lineTo(boat.width, boat.length*0.3);
      ctx.closePath();
      ctx.fill();
      // stroke
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.stroke();
      // oars (simple lines)
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-boat.width*1.6, 0); ctx.lineTo(-boat.width*3.2, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(boat.width*1.6, 0); ctx.lineTo(boat.width*3.2, 10); ctx.stroke();
      ctx.restore();

      // HUD
      const speed = Math.hypot(boat.vx, boat.vy);
      hudSpeed.textContent = speed.toFixed(2);
      hudHeading.textContent = (Math.round((boat.angle*180/Math.PI+360)%360)) + '°';
    }

    // start
    requestAnimationFrame(step);
  </script>
</body>
</html>
